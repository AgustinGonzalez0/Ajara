name: structura_mobile
description: "STRUCTURA AI — interpretación de planos 2D y reconstrucción 3D local."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  # Estado y navegación
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0   # 18.x migra a material_ui; se mantiene 17.x con flutter/material
  # Archivos y persistencia local
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  path: ^1.9.1
  uuid: ^4.6.0
  crypto: ^3.0.7
  # Cámara y galería del sistema (sin permiso de cámara propio, sin red)
  image_picker: ^1.2.3
  # Imágenes (PNG/JPG/TIFF en Dart puro) y matemática 3D
  image: ^4.13.1
  vector_math: ^2.4.2
  # STRUCTURA CORE (Dart)
  structura_model:
    path: ../packages/structura_model
  structura_geometry:
    path: ../packages/structura_geometry
  structura_pipeline:
    path: ../packages/structura_pipeline
  structura_vision:
    path: ../packages/structura_vision
  structura_sim:
    path: ../packages/structura_sim
  share_plus: ^13.3.1
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/fonts/
